name: 🎲 Random Choice
on:
  workflow_dispatch:
    inputs:
      task:
        description: Script to run (for example dice/roll.sh)
        required: true
        default: dice/roll.sh
        type: string

jobs:
  run:
    name: 🎲 Running Choice
    runs-on: ubuntu-latest
    steps:
      - name: ⬇ Checkout
        uses: actions/checkout@v4

      - name: 🧹 ShellCheck
        run: shellcheck dice/*.sh deck/*.sh random/*.sh

      - name: ⚙️ Executing
        env:
          TASK: ${{ inputs.task }}
        run: |
          if [[ ! $TASK =~ ^[A-Za-z0-9_./-]+\.sh$ ]] || [[ ! -f $TASK ]]; then
            echo "Invalid script: $TASK"
            echo "Available:"
            find . -name '*.sh' -not -path './.git/*' | sort
            exit 1
          fi
          bash "$TASK"
